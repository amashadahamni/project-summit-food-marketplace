<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - Project Summit</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #0f172a; background: #e8eef8; font-family: Inter, system-ui, sans-serif; }
    .card { width: min(100%, 470px); padding: 42px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 24px 60px rgba(15, 23, 42, .14); text-align: center; }
    .mark { width: 46px; height: 46px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 10px; color: white; background: #2563eb; font-weight: 800; font-size: 1.4rem; }
    h1 { margin: 0 0 10px; font-size: 1.65rem; } p { color: #64748b; line-height: 1.55; font-size: .9rem; }
    #status { display: none; margin: 18px 0; padding: 11px 14px; border: 1px solid #fde68a; border-radius: 8px; background: #fef9c3; color: #92400e; font-size: .82rem; text-align: left; }
    button { width: 100%; margin-top: 18px; padding: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid #e2e8f0; border-radius: 10px; color: #0f172a; background: #fff; cursor: pointer; font-size: .9rem; font-weight: 700; }
    button:hover { box-shadow: 0 4px 18px rgba(0, 0, 0, .09); } a { color: #2563eb; font-weight: 700; text-decoration: none; }
    .fine-print { margin-top: 22px; font-size: .8rem; } .signin { margin-top: 26px; font-size: .85rem; }
  </style>
</head>
<body data-auth-mode="signup">
  <main class="card right">
    <div class="mark">S</div>
    <h1>Create your account</h1>
    <p>Choose a Google account to create your Summit Food Marketplace profile.</p>
    <div id="status" role="alert"></div>
    <button id="googleBtn" type="button">Continue with Google</button>
    <p class="fine-print">Your first Google sign-in creates a Firebase account automatically.</p>
    <p class="signin">Already have an account? <a href="frontend/login/login.html">Log in</a></p>
  </main>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cognito-auth.js"></script>
</body>
</html>
