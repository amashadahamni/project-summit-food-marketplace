<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Account | Summit Food Marketplace</title><link rel="stylesheet" href="serviceStyles.css"></head><body><header class="site-header"><a class="brand" href="../home/home.html">Summit <span>Food Marketplace</span></a><nav><a href="../home/home.html">Home</a><a href="../product/products.html">Products</a><a href="../product/cart.html">Cart</a><a aria-current="page" href="account.html">Account</a></nav><div class="auth-actions"><a id="loginLink" href="../../frontend/login/login.html" hidden>Log in</a><button id="signOutBtn" class="text-button" type="button" hidden>Log out</button></div></header><main><section class="page-title"><p class="eyebrow">Your profile</p><h1>Account <span id="welcomeName"></span></h1></section><p id="accountStatus" class="status">Loading account...</p><form id="profileForm" class="panel" hidden><h2>Profile</h2><p id="email"></p><label>Display name<input id="displayName" minlength="2" maxlength="160"></label><p><button class="button" type="submit">Save profile</button></p></form><section id="customerReviews" class="panel" hidden><h2>Add a Customer Review</h2><form id="reviewForm"><label>Rating<select id="rating" required><option value="">Choose a rating</option><option value="5">5 stars - Excellent</option><option value="4">4 stars - Very good</option><option value="3">3 stars - Good</option><option value="2">2 stars - Fair</option><option value="1">1 star - Poor</option></select></label><label>Comment<textarea id="comment" minlength="2" maxlength="1000" required></textarea></label><p><button class="button" type="submit">Submit review</button></p></form><div id="reviewList"></div></section></main><script src="../../js/auth-config.js"></script><script src="../../js/cognito-auth.js"></script><script src="servicePage.js"></script></body></html>
