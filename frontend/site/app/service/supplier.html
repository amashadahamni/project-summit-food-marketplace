<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Supplier Workspace | Summit Food Marketplace</title><link rel="stylesheet" href="serviceStyles.css"></head><body><header class="site-header"><a class="brand" href="../home/home.html">Summit <span>Food Marketplace</span></a><nav><a href="../home/home.html">Home</a><a href="../product/products.html">Products</a><a href="../product/cart.html">Cart</a><a href="account.html">Account</a></nav></header><main><section class="page-title"><p class="eyebrow">Supplier service</p><h1>Submit a product</h1><p class="lead">New and edited products are reviewed before customers can discover them.</p></section><p id="supplierStatus" class="status"></p><form id="productForm" class="panel"><div class="form-grid"><label>Name<input name="name" minlength="2" maxlength="160" required></label><label>Category<input name="category" minlength="2" maxlength="80" required></label><label>Price<input name="price" type="number" min="0.01" step="0.01" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label class="wide">Producer<input name="producer" minlength="2" maxlength="160" required></label><label class="wide">Description<textarea name="description" minlength="10" maxlength="3000" required></textarea></label></div><p><button class="button" type="submit">Submit for review</button></p></form><section class="panel"><h2>Your products</h2><div id="myProducts"></div></section></main><script src="../../js/auth-config.js"></script><script src="../../js/cognito-auth.js"></script><script src="supplierPage.js"></script></body></html>
