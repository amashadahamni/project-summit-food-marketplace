name: Verify Marketplace

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Product Service
        working-directory: backend/product-service
        run: |
          pip install -r requirements.txt
          pytest tests -q
      - name: Test Cart Service
        working-directory: backend/cart-service
        run: |
          pip install -r requirements.txt
          pytest tests -q
      - name: Compile User Service
        working-directory: backend/user-service
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
      - name: Check BFF syntax
        run: node --check bff/index.js
      - name: Validate Compose file
        run: docker compose config -q