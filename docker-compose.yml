version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: summit_food
      POSTGRES_USER: summit_user
      POSTGRES_PASSWORD: summit_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgres://summit_user:summit_pass@postgres:5432/summit_food
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    depends_on:
      - postgres
    ports:
      - "8001:8001"

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgres://summit_user:summit_pass@postgres:5432/summit_food
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  cart-service:
    build: ./services/cart-service
    environment:
      DATABASE_URL: postgres://summit_user:summit_pass@postgres:5432/summit_food
      PRODUCT_SERVICE_URL: http://product-service:8001
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    depends_on:
      - postgres
    ports:
      - "8002:8002"

  bff:
    build: ./bff
    environment:
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8001
      CART_SERVICE_URL: http://cart-service:8002
    depends_on:
      - user-service
      - product-service
      - cart-service
    ports:
      - "8080:8080"

volumes:
  postgres_data:
