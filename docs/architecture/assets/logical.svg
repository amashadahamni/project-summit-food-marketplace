<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750">
  <style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:30px;font-weight:700}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.identity{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.data{fill:#ecfdf5;stroke:#047857;stroke-width:2}.label{font-size:18px;font-weight:700}.small{font-size:14px}.line{stroke:#486581;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <rect width="1400" height="750" fill="#f8fbff"/><text x="50" y="55" class="title">Summit Food Marketplace: Logical Architecture</text>
  <rect x="50" y="140" width="170" height="72" rx="8" class="box"/><text x="135" y="183" text-anchor="middle" class="label">Browser</text>
  <rect x="50" y="300" width="170" height="72" rx="8" class="identity"/><text x="135" y="343" text-anchor="middle" class="label">Amazon Cognito</text>
  <rect x="310" y="90" width="230" height="80" rx="8" class="box"/><text x="425" y="123" text-anchor="middle" class="label">Vite + single-spa</text><text x="425" y="148" text-anchor="middle" class="small">root configuration</text>
  <rect x="310" y="215" width="230" height="72" rx="8" class="box"/><text x="425" y="258" text-anchor="middle" class="label">Customer MFE</text>
  <rect x="310" y="335" width="230" height="72" rx="8" class="box"/><text x="425" y="378" text-anchor="middle" class="label">Supplier MFE</text>
  <rect x="310" y="455" width="230" height="72" rx="8" class="box"/><text x="425" y="498" text-anchor="middle" class="label">Data Steward MFE</text>
  <rect x="640" y="275" width="210" height="100" rx="8" class="box"/><text x="745" y="317" text-anchor="middle" class="label">Node.js BFF</text><text x="745" y="343" text-anchor="middle" class="small">token validation, routing</text>
  <rect x="950" y="130" width="210" height="78" rx="8" class="box"/><text x="1055" y="176" text-anchor="middle" class="label">User Service</text>
  <rect x="950" y="275" width="210" height="78" rx="8" class="box"/><text x="1055" y="311" text-anchor="middle" class="label">Product Service</text><text x="1055" y="333" text-anchor="middle" class="small">including approval module</text>
  <rect x="950" y="420" width="210" height="78" rx="8" class="box"/><text x="1055" y="466" text-anchor="middle" class="label">Cart Service</text>
  <rect x="1230" y="275" width="120" height="78" rx="8" class="data"/><text x="1290" y="311" text-anchor="middle" class="label">PostgreSQL</text><text x="1290" y="333" text-anchor="middle" class="small">shared local DB</text>
  <line x1="220" y1="176" x2="310" y2="130" class="line"/><line x1="135" y1="212" x2="135" y2="300" class="line"/><line x1="540" y1="251" x2="640" y2="305" class="line"/><line x1="540" y1="371" x2="640" y2="325" class="line"/><line x1="540" y1="491" x2="640" y2="345" class="line"/><line x1="850" y1="315" x2="950" y2="170" class="line"/><line x1="850" y1="325" x2="950" y2="315" class="line"/><line x1="850" y1="340" x2="950" y2="460" class="line"/><line x1="1160" y1="315" x2="1230" y2="315" class="line"/>
  <text x="50" y="690" class="small">The separate 4IR demand-risk MVP is deliberately isolated from the mandatory marketplace architecture and is shown in its own data-flow export.</text>
</svg>