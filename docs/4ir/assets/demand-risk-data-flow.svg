<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="540" viewBox="0 0 1250 540">
  <style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:30px;font-weight:700}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.data{fill:#ecfdf5;stroke:#047857;stroke-width:2}.control{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.label{font-size:18px;font-weight:700}.small{font-size:14px}.line{stroke:#486581;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
  <rect width="1250" height="540" fill="#f8fbff"/><text x="55" y="55" class="title">4IR MVP: Demand Risk Decision-Support Data Flow</text>
  <rect x="55" y="190" width="190" height="115" rx="8" class="box"/><text x="150" y="230" text-anchor="middle" class="label">Supplier</text><text x="150" y="258" text-anchor="middle" class="small">Current stock, lead time,</text><text x="150" y="278" text-anchor="middle" class="small">aggregate daily unit sales</text>
  <rect x="335" y="190" width="220" height="115" rx="8" class="control"/><text x="445" y="230" text-anchor="middle" class="label">FastAPI validation</text><text x="445" y="258" text-anchor="middle" class="small">Bounded values, non-negative</text><text x="445" y="278" text-anchor="middle" class="small">sales, safe 422 errors</text>
  <rect x="645" y="190" width="240" height="115" rx="8" class="box"/><text x="765" y="230" text-anchor="middle" class="label">Explainable forecast</text><text x="765" y="258" text-anchor="middle" class="small">Recent 7 days 70%</text><text x="765" y="278" text-anchor="middle" class="small">Prior 7 days 30% + safety stock</text>
  <rect x="975" y="190" width="220" height="115" rx="8" class="data"/><text x="1085" y="230" text-anchor="middle" class="label">Decision output</text><text x="1085" y="258" text-anchor="middle" class="small">Risk, stock cover, reorder</text><text x="1085" y="278" text-anchor="middle" class="small">recommendation, explanation</text>
  <line x1="245" y1="247" x2="335" y2="247" class="line"/><line x1="555" y1="247" x2="645" y2="247" class="line"/><line x1="885" y1="247" x2="975" y2="247" class="line"/>
  <rect x="300" y="385" width="650" height="72" rx="8" class="control"/><text x="625" y="416" text-anchor="middle" class="label">Human-in-the-loop control</text><text x="625" y="440" text-anchor="middle" class="small">The supplier decides whether to reorder. No personal customer data, automatic purchasing, or external AI model is used.</text>
</svg>