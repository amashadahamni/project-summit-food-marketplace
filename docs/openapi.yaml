openapi: 3.0.3
info:
  title: Summit Food Marketplace API Specification
  description: >-
    OpenAPI contract for the externally consumed APIs of the Summit Food Marketplace
    project. This specification reflects the BFF endpoints and the backend product,
    cart, and approval services.
  version: 1.0.0
  contact:
    name: Team Summit
servers:
  - url: http://localhost:8080
    description: BFF API (frontend-facing interface)
  - url: http://localhost:8001
    description: Product Service
  - url: http://localhost:8002
    description: Cart Service
  - url: http://localhost:8003
    description: Approval Service
security:
  - bearerAuth: []
tags:
  - name: BFF
    description: Frontend-facing routes exposed by the Backend for Frontend
  - name: Products
    description: Product catalog and product management APIs
  - name: Carts
    description: Customer shopping cart APIs
  - name: Approvals
    description: Supplier product approval and rejection APIs
paths:
  /api/products:
    get:
      tags:
        - BFF
      summary: Get products
      description: Returns products from the product service.
      parameters:
        - in: query
          name: approved
          schema:
            type: boolean
          required: false
          description: Filter products by approval status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Bad request
    post:
      tags:
        - BFF
      summary: Create a product
      description: Creates a product in the product service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input

  /api/carts:
    post:
      tags:
        - BFF
      summary: Create or update cart
      description: Creates or updates a customer cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart'
      responses:
        '200':
          description: Cart created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid cart payload

  /api/carts/{customer_id}:
    get:
      tags:
        - BFF
      summary: Get cart by customer id
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
          description: Customer identifier.
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart not found

  /api/submissions:
    get:
      tags:
        - BFF
      summary: Get submissions
      description: Returns supplier submissions.
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
          description: Optional filter by submission status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
        '400':
          description: Bad request

  /api/submissions/{submission_id}/approve:
    put:
      tags:
        - BFF
      summary: Approve a submission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema:
            type: integer
          description: Submission identifier.
      responses:
        '200':
          description: Submission approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found

  /api/submissions/{submission_id}/reject:
    put:
      tags:
        - BFF
      summary: Reject a submission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema:
            type: integer
          description: Submission identifier.
        - in: query
          name: reason
          required: true
          schema:
            type: string
          description: Rejection reason sent to the approval service.
      responses:
        '200':
          description: Submission rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found

  /products:
    get:
      tags:
        - Products
      summary: List products from the product service
      parameters:
        - in: query
          name: approved
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: Products returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
        - Products
      summary: Create a product in the product service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{product_id}:
    get:
      tags:
        - Products
      summary: Get a single product by id
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      tags:
        - Products
      summary: Update a product by id
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /carts/{customer_id}:
    get:
      tags:
        - Carts
      summary: Get customer cart
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cart found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart not found

  /carts:
    post:
      tags:
        - Carts
      summary: Create or replace a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart'
      responses:
        '200':
          description: Cart saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /carts/{customer_id}/items/{product_id}:
    delete:
      tags:
        - Carts
      summary: Remove a product from a cart
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart not found

  /submissions:
    get:
      tags:
        - Approvals
      summary: List submissions
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Submissions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
    post:
      tags:
        - Approvals
      summary: Submit a product for approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
      responses:
        '200':
          description: Submission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /submissions/{submission_id}/approve:
    put:
      tags:
        - Approvals
      summary: Approve a submission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Submission approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found

  /submissions/{submission_id}/reject:
    put:
      tags:
        - Approvals
      summary: Reject a submission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema:
            type: integer
        - in: query
          name: reason
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Submission not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      required:
        - name
        - category
        - price
        - description
        - stock
        - supplier_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Fresh Apples
        category:
          type: string
          example: Fruit
        price:
          type: number
          format: double
          example: 4.5
        description:
          type: string
          example: Organic red apples
        stock:
          type: integer
          example: 100
        supplier_id:
          type: integer
          example: 10
        approved:
          type: boolean
          example: false
        status:
          type: string
          example: pending
        rejection_reason:
          type: string
          example: ""

    CartItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2

    Cart:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: integer
          example: 12
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    Submission:
      type: object
      required:
        - supplier_id
        - product_name
        - category
        - price
        - description
        - stock
      properties:
        id:
          type: integer
          example: 1
        supplier_id:
          type: integer
          example: 25
        product_name:
          type: string
          example: Fresh Apples
        category:
          type: string
          example: Fruit
        price:
          type: number
          example: 4.5
        description:
          type: string
          example: Organic red apples
        stock:
          type: integer
          example: 100
        status:
          type: string
          example: pending
        rejection_reason:
          type: string
          example: ""
